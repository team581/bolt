[tools]
node = "26"
pitchfork = "2.20.0"
pnpm = "11"

[settings]
env_file = ".env.local"

[env]
DATABASE_URL = "postgresql://bolt:bolt@localhost:5432/bolt"
GITHUB_APP_ID = "3658873"
GITHUB_INSTALLATION_ID = "130950814"

[tasks.postgres]
run = "pitchfork start postgres"
hide = true

[tasks.dev]
description = "Start Bolt's development server"
depends = ["postgres"]
run = "vp run dev"
raw = true

[tasks.dev.env]
NODE_ENV = "development"
