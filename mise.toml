[tools]
pitchfork = "2.24.2"

[settings]
env_file = ".env.local"
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[env]
DATABASE_URL = { default = "postgresql://bolt:bolt@localhost:5432/bolt" }
GITHUB_APP_ID = { default = "3658873" }
GITHUB_INSTALLATION_ID = { default = "130950814" }

[tasks.postgres]
run = "pitchfork start postgres"
hide = true

[tasks.dev]
description = "Start Bolt's development server"
depends = ["postgres"]
run = "vp run dev"
raw = true

[tasks.dev.env]
NODE_ENV = "development"
