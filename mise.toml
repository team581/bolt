[tools]
node = "26"
pitchfork = "2.20.0"
pnpm = "11"

[settings]
env_file = ".env.local"

[tasks.postgres]
run = "pitchfork start postgres"
hide = true

[tasks.dev]
description = "Start Bolt's development server"
depends = ["postgres"]
run = "vp run dev"
raw = true

[tasks.dev.env]
NODE_ENV = "development"
