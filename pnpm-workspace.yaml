allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@sentry/cli": true
  cbor-extract: false
  esbuild: true
  node-liblzma: true
  protobufjs: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.11
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@sentry/junior"
  - "@sentry/junior-dashboard"
  - "@sentry/junior-plugin-api"
