allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@sentry/cli": true
  cbor-extract: false
  esbuild: true
  node-liblzma: true
  protobufjs: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.11
patchedDependencies:
  "@mastra/core@1.63.2": patches/@mastra__core@1.63.2.patch
  "@mastra/daytona@0.9.1": patches/@mastra__daytona@0.9.1.patch
  mastra@1.27.2: patches/mastra@1.27.2.patch
packageExtensions:
  "@daytonaio/sdk@*":
    dependencies:
      tslib: ^2.8.1
  "@opentelemetry/sdk-node@0.207.0":
    dependencies:
      "@opentelemetry/context-async-hooks": 2.2.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@mastra/daytona@0.8.0"
  - "@mastra/core@1.60.0"
  - "@mastra/deployer@1.60.0"
  - "@mastra/memory@1.27.0"
  - "@mastra/observability@1.17.1"
  - "@mastra/otel-exporter@1.3.9"
  - "@mastra/pg@1.21.0"
  - "@mastra/sentry@1.2.11"
  - "@mastra/server@1.60.0"
  - mastra@1.25.1
