allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@sentry/cli": true
  node-liblzma: true
  protobufjs: true
patchedDependencies:
  { "@sentry/junior": patches/@sentry__junior.patch, "@vercel/sandbox": patches/@vercel__sandbox.patch }
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Temporarily doing this to get a change out before I forget
minimumReleaseAgeExclude:
  - "@sentry/junior@0.55.0"
  - "@sentry/junior-plugin-api@0.55.0"
  - "@sentry/junior-github@0.55.0"
