display_information:
  name: Bolt
  description: AI coding agent for Team 581 software
  background_color: "#591616"
features:
  bot_user:
    display_name: Bolt
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    request_url: https://bolt-581.up.railway.app/channels/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: false
