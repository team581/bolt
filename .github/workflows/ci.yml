name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATEWAY_API_KEY: ci-ai-gateway-key
      DAYTONA_API_KEY: ci-daytona-key
      DATABASE_URL: postgresql://localhost:5432/postgres
      GITHUB_APP_PRIVATE_KEY: ci-github-private-key
      SLACK_BOT_TOKEN: xoxb-ci
      SLACK_SIGNING_SECRET: ci-slack-signing-secret

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Check lint and formatting
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
