name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Fallow
        uses: fallow-rs/fallow@34269241152fa2e7e6a9de1aba698dcae93035b3 # v3

  build:
    name: Build

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATEWAY_API_KEY: ci-ai-gateway-key
      DATABASE_URL: postgresql://localhost:5432/postgres
      GCS_SERVICE_ACCOUNT_KEY: '{"client_email":"bolt@example.com","private_key":"ci-private-key","token_uri":"https://oauth2.googleapis.com/token"}'
      GITHUB_APP_ID: ci-github-app-id
      GITHUB_INSTALLATION_ID: 1
      GITHUB_APP_PRIVATE_KEY: ci-github-private-key
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_SERVICE_ACCOUNT_KEY: '{"client_email":"bolt-drive-reader@example.com","private_key":"ci-private-key","token_uri":"https://oauth2.googleapis.com/token"}'
      JUNIOR_BASE_URL: https://bolt.example.com
      JUNIOR_DATABASE_DRIVER: postgres
      JUNIOR_SECRET: ci-junior-secret
      CRON_SECRET: ci-cron-secret
      REDIS_URL: redis://localhost:6379
      SLACK_BOT_TOKEN: xoxb-ci
      SLACK_SIGNING_SECRET: ci-slack-signing-secret

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Check Junior configuration
        run: vp run check:junior
      - name: Check lint and formatting
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
