name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Check Junior skills and plugins
        run: vp exec junior check
      - name: Check lint and formatting
        run: vp check
      - name: Build
        run: vp build
