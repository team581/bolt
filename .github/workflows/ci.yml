name: CI

on: [push, pull_request]

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Run Fallow
        uses: fallow-rs/fallow@v3

  build:
    name: Build

    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_GATEWAY_API_KEY: ci-ai-gateway-key
      DAYTONA_API_KEY: ci-daytona-key
      DATABASE_URL: postgresql://localhost:5432/postgres
      GCS_SERVICE_ACCOUNT_KEY: "{}"
      GITHUB_APP_ID: ci-github-app-id
      GITHUB_INSTALLATION_ID: 1
      GITHUB_APP_PRIVATE_KEY: ci-github-private-key
      MASTRA_API_KEY: ci-mastra-api-key
      MASTRA_PLATFORM_ACCESS_TOKEN: ci-mastra-platform-access-token
      MASTRA_PROJECT_ID: ci-mastra-project-id
      SLACK_BOT_TOKEN: xoxb-ci
      SLACK_SIGNING_SECRET: ci-slack-signing-secret

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Check lint and formatting
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
