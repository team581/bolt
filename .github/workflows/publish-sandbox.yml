name: Publish sandbox snapshot

on:
  push:
    branches: [main]

concurrency:
  group: publish-sandbox-snapshot
  cancel-in-progress: false

env:
  SNAPSHOT_NAME: bolt-sandbox

permissions:
  contents: read

jobs:
  publish:
    name: Build Daytona snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_API_URL: ${{ vars.DAYTONA_API_URL }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Checkout offseason repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: sandbox/repositories/offseason-2026
          persist-credentials: false
          repository: team581/offseason-2026
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Install Daytona CLI
        run: brew trust daytonaio/cli && brew install daytonaio/cli/daytona
      - name: Replace snapshot
        working-directory: sandbox
        run: |
          if daytona snapshot list --format json --limit 100 \
            | jq --exit-status --arg name "$SNAPSHOT_NAME" '.[] | select(.name == $name)' > /dev/null; then
            daytona snapshot delete "$SNAPSHOT_NAME"
            sleep 5
          fi

          snapshot_args=(
            --dockerfile Containerfile
            --context .
            --cpu 2
            --memory 4
            --disk 3
            --sandbox-class container
          )
          if [[ -n "$DAYTONA_TARGET" ]]; then
            snapshot_args+=(--region "$DAYTONA_TARGET")
          fi
          daytona snapshot create "$SNAPSHOT_NAME" "${snapshot_args[@]}"
