name: Publish sandbox snapshot

on:
  push:
    branches: [main]

concurrency:
  group: publish-sandbox-snapshot
  cancel-in-progress: false

env:
  SNAPSHOT_NAME: bolt-sandbox

permissions:
  contents: read

jobs:
  publish:
    name: Build Daytona snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_API_URL: ${{ vars.DAYTONA_API_URL }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Checkout offseason repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: sandbox/repositories/offseason-2026
          persist-credentials: false
          repository: team581/offseason-2026
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Replace snapshot
        run: vp run publish:sandbox
