name: Publish sandbox image

on:
  push:
    branches: [main]

concurrency:
  group: publish-sandbox-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/team581/bolt-sandbox:latest
  MISE_CEILING_PATHS: ${{ github.workspace }}
  MISE_EXPERIMENTAL: 1

permissions:
  contents: read
  packages: write

jobs:
  publish-amd64:
    name: Publish linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
          experimental: true
          install_args: gh node
          working_directory: sandbox
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        working-directory: sandbox
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=MISE_CEILING_PATHS,MISE_EXPERIMENTAL,MISE_GITHUB_TOKEN,MISE_LOG_LEVEL,MISE_TRUSTED_CONFIG_PATHS,MISE_YES,SOURCE_DATE_EPOCH \
            env MISE_DATA_DIR="$HOME/.local/share/mise" \
            "$(command -v mise)" oci build --no-mise --output ../mise-oci
          sudo chown -R "$(id -u):$(id -g)" ../mise-oci
          mise oci push --image-dir ../mise-oci --update-index "$IMAGE"

  publish-arm64:
    name: Publish linux/arm64
    needs: publish-amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
          experimental: true
          install_args: gh node
          working_directory: sandbox
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        working-directory: sandbox
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=MISE_CEILING_PATHS,MISE_EXPERIMENTAL,MISE_GITHUB_TOKEN,MISE_LOG_LEVEL,MISE_TRUSTED_CONFIG_PATHS,MISE_YES,SOURCE_DATE_EPOCH \
            env MISE_DATA_DIR="$HOME/.local/share/mise" \
            "$(command -v mise)" oci build --no-mise --output ../mise-oci
          sudo chown -R "$(id -u):$(id -g)" ../mise-oci
          mise oci push --image-dir ../mise-oci --update-index "$IMAGE"
