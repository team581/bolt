name: autofix.ci # needed to securely identify the workflow

on: [push, pull_request]

permissions:
  contents: read

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/postgres
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Regenerate Google Workspace tool snapshot
        run: vp run generate:google-workspace-tools
      - name: Update WPILOG analysis skill
        run: |
          skill_dir="$(mktemp -d)"
          skills_cli="$PWD/node_modules/.bin/skills"
          git -C "$skill_dir" init --quiet
          (
            cd "$skill_dir"
            "$skills_cli" add jonahsnider/wpilog-parser --skill analyze-wpilog --agent codex --copy --yes
          )
          cp "$skill_dir/.agents/skills/analyze-wpilog/SKILL.md" app/skills/analyze-wpilog/SKILL.md
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.BOLT_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.BOLT_GITHUB_APP_PRIVATE_KEY }}
          owner: team581
      - name: Regenerate prompt files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: vp run generate:prompts
      - name: Apply lint and formatting fixes
        run: vp check --fix
      - name: Run autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
