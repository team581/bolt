services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bolt
      POSTGRES_PASSWORD: bolt
      POSTGRES_USER: bolt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U bolt -d bolt -tAc 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
